server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # php über den Docker-DNS bei jeder Anfrage neu auflösen: Wird der php-Container neu
    # erstellt (neue IP), liefert nginx sonst 502, bis es selbst neu startet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # Route all requests through the front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Wie AddType in public/.htaccess — Chrome erwartet den Manifest-Typ
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
